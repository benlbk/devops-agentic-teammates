replicaCount: 2

image:
  repository: 448658572737.dkr.ecr.ap-southeast-1.amazonaws.com/agent-orchestrator
  tag: "latest"
  pullPolicy: Always

serviceAccount:
  create: true
  name: agent-orchestrator
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::448658572737:role/agent-orchestrator-role

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: ""
      paths:
        - path: /orchestrator
          pathType: Prefix

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

env:
  AWS_REGION: ap-southeast-1
  DYNAMODB_TABLE_NAME: agent-state
  EVENTBRIDGE_BUS_NAME: devops-agentic-teammates
  LOG_LEVEL: INFO
  LLM_PROVIDER: bedrock
  LLM_MODEL: anthropic.claude-sonnet-4-20250514

envFromSecrets:
  - secretName: agent-orchestrator-secrets
    keys:
      - GITHUB_TOKEN
      - GITHUB_WEBHOOK_SECRET

nodeSelector: {}

tolerations: []

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: /metrics
