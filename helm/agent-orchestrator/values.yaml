replicaCount: 2

image:
  repository: 448658572737.dkr.ecr.ap-southeast-1.amazonaws.com/agent-orchestrator
  tag: "latest"
  pullPolicy: Always

serviceAccount:
  create: true
  name: agent-orchestrator
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::448658572737:role/agent-orchestrator-role

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: ""
      paths:
        - path: /orchestrator(/|$)(.*)
          pathType: ImplementationSpecific

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

env:
  AGENT_AWS_REGION: ap-southeast-1
  AGENT_DYNAMODB_STATE_TABLE: agent-state
  AGENT_DYNAMODB_AUDIT_TABLE: agent-audit
  AGENT_EVENT_BUS_NAME: devops-agentic-teammates
  AGENT_LOG_LEVEL: INFO
  AGENT_BEDROCK_MODEL_ID: anthropic.claude-sonnet-4-20250514
  AGENT_BEDROCK_REGION: ap-southeast-1

envFromSecrets:
  - secretName: agent-orchestrator-secrets
    keys:
      - AGENT_GITHUB_TOKEN
      - AGENT_GITHUB_WEBHOOK_SECRET

nodeSelector: {}

tolerations: []

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: /metrics
