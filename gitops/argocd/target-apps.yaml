apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: target-frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: target-app
  source:
    repoURL: https://github.com/benlbk/devops-agentic-teammates.git
    targetRevision: HEAD
    path: helm/target-frontend
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: target-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: target-backend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: target-app
  source:
    repoURL: https://github.com/benlbk/devops-agentic-teammates.git
    targetRevision: HEAD
    path: helm/target-backend
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: target-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
