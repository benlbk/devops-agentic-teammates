apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-orchestrator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: devops-agentic-teammates
  source:
    repoURL: https://github.com/benlbk/devops-agentic-teammates.git
    targetRevision: HEAD
    path: helm/agent-orchestrator
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: agents
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
