apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: target-backend-canary
  namespace: target-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: target-backend
  template:
    metadata:
      labels:
        app: target-backend
    spec:
      containers:
        - name: backend
          image: 448658572737.dkr.ecr.ap-southeast-1.amazonaws.com/target-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:5000
          envFrom:
            - secretRef:
                name: target-backend-db
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
  strategy:
    canary:
      canaryService: target-backend-canary
      stableService: target-backend-stable
      trafficRouting:
        nginx:
          stableIngress: target-backend
          additionalIngressAnnotations:
            canary-by-header: X-Canary
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 30
        - pause: { duration: 2m }
        - setWeight: 60
        - pause: { duration: 5m }
        - setWeight: 100
      analysis:
        templates:
          - templateName: success-rate
        startingStep: 1
        args:
          - name: service-name
            value: target-backend
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: target-app
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 60s
      successCondition: result[0] >= 0.95
      failureCondition: result[0] < 0.90
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(nginx_ingress_controller_requests{service="{{args.service-name}}", status!~"5.."}[2m]))
            /
            sum(rate(nginx_ingress_controller_requests{service="{{args.service-name}}"}[2m]))
---
apiVersion: v1
kind: Service
metadata:
  name: target-backend-stable
  namespace: target-app
spec:
  selector:
    app: target-backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: target-backend-canary
  namespace: target-app
spec:
  selector:
    app: target-backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: target-backend
  namespace: target-app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /api/target
            pathType: Prefix
            backend:
              service:
                name: target-backend-stable
                port:
                  number: 5000
