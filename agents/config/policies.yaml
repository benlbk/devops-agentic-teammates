# Agent Policy Configuration
# Governs what actions each agent can perform and under what conditions.

policies:
  # ---- Code & Build Agent ----
  - name: code-review-allow
    agent: code-build
    action: pull_request.opened
    enabled: true

  - name: code-review-sync-allow
    agent: code-build
    action: pull_request.synchronize
    enabled: true

  - name: code-gen-approval-required
    agent: code-build
    action: code-generation
    environment: production
    require_approval: true
    approvers: ["benlbk"]

  - name: code-gen-dev-allow
    agent: code-build
    action: code-generation
    environment: dev

  # ---- Test & Secure Agent ----
  - name: test-gen-allow
    agent: test-secure
    action: generate-tests
    enabled: true

  - name: security-scan-allow
    agent: test-secure
    action: security-scan
    enabled: true

  - name: security-scan-pr-allow
    agent: test-secure
    action: check_run.completed
    enabled: true

  # ---- Release & Deploy Agent ----
  - name: deploy-staging-allow
    agent: release-deploy
    action: deploy
    environment: staging
    enabled: true

  - name: deploy-production-approval
    agent: release-deploy
    action: deploy
    environment: production
    require_approval: true
    approvers: ["benlbk"]
    constraints:
      strategy: canary
      max_batch_size: 25

  - name: release-allow
    agent: release-deploy
    action: release
    enabled: true

  - name: ephemeral-env-allow
    agent: release-deploy
    action: ephemeral-environment
    enabled: true
    constraints:
      max_environments: 5
      ttl_hours: 48

  - name: terraform-review-allow
    agent: release-deploy
    action: terraform-review
    enabled: true

  # ---- Plan & Collaborate Agent ----
  - name: plan-allow
    agent: plan-collaborate
    action: issues.opened
    enabled: true

  - name: plan-feature-allow
    agent: plan-collaborate
    action: feature-planning
    enabled: true

  # ---- Operate & Monitor Agent ----
  - name: incident-auto-remediate
    agent: operate-monitor
    action: incident-response
    enabled: true
    constraints:
      auto_remediate_severity: ["SEV3", "SEV4"]
      require_approval_severity: ["SEV1", "SEV2"]

  - name: incident-critical-approval
    agent: operate-monitor
    action: incident-response
    environment: production
    conditions:
      severity: SEV1
    require_approval: true
    approvers: ["benlbk"]

  - name: cost-analysis-allow
    agent: operate-monitor
    action: cost-analysis
    enabled: true

  - name: performance-allow
    agent: operate-monitor
    action: performance-analysis
    enabled: true
