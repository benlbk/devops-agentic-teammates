[tool.poetry]
name = "devops-agentic-teammates"
version = "1.0.0"
description = "AI-enabled DevOps agent platform for end-to-end SDLC automation"
authors = ["Platform Team"]
readme = "README.md"
packages = [
    { include = "orchestrator", from = "src" },
    { include = "agents", from = "src" },
    { include = "shared", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.12"
langgraph = "^0.2"
langchain-core = "^0.3"
langchain-aws = "^0.2"
langchain-openai = "^0.2"
boto3 = "^1.34"
pydantic = "^2.0"
pydantic-settings = "^2.0"
httpx = "^0.27"
pygithub = "^2.3"
pyyaml = "^6.0"
structlog = "^24.0"
uvicorn = "^0.30"
fastapi = "^0.115"
opensearch-py = "^2.5"
tenacity = "^8.3"
tiktoken = "^0.7"
jinja2 = "^3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.5"
mypy = "^1.10"
moto = {version = "^5.0", extras = ["dynamodb", "events", "s3", "secretsmanager"]}
respx = "^0.21"

[tool.poetry.scripts]
orchestrator = "orchestrator.main:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
