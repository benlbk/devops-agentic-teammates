apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-dora-metrics
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  dora-metrics.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "title": "Deployment Frequency (deploys/day)",
          "type": "stat",
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "targets": [{"expr": "sum(increase(kube_deployment_status_observed_generation{namespace=~\"target-app|agents\"}[24h]))"}],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 1}, {"color": "green", "value": 3}]}}}
        },
        {
          "title": "Change Failure Rate (%)",
          "type": "gauge",
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
          "targets": [{"expr": "sum(rate(nginx_ingress_controller_requests{namespace=\"target-app\", status=~\"5..\"}[1h])) / sum(rate(nginx_ingress_controller_requests{namespace=\"target-app\"}[1h])) * 100"}],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 5}, {"color": "red", "value": 15}]}}}
        },
        {
          "title": "Pod Availability (%)",
          "type": "gauge",
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
          "targets": [{"expr": "sum(kube_deployment_status_replicas_available{namespace=~\"target-app|agents\"}) / sum(kube_deployment_status_replicas{namespace=~\"target-app|agents\"}) * 100"}],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 95}, {"color": "green", "value": 99}]}}}
        },
        {
          "title": "Pod Restarts (MTTR Proxy)",
          "type": "stat",
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0},
          "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"target-app|agents\"}[1h]))"}],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 3}, {"color": "red", "value": 10}]}}}
        },
        {
          "title": "Deployment Generation Over Time",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 6},
          "targets": [{"expr": "kube_deployment_status_observed_generation{namespace=~\"target-app|agents\"}", "legendFormat": "{{deployment}}"}],
          "datasource": {"type": "prometheus", "uid": "prometheus"}
        },
        {
          "title": "Request Volume by Namespace",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "targets": [{"expr": "sum(rate(nginx_ingress_controller_requests[5m])) by (namespace)", "legendFormat": "{{namespace}}"}],
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "title": "Error Rate by Namespace",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "targets": [{"expr": "sum(rate(nginx_ingress_controller_requests{status=~\"5..\"}[5m])) by (namespace)", "legendFormat": "{{namespace}}"}],
          "datasource": {"type": "prometheus", "uid": "prometheus"}
        },
        {
          "title": "Container Restarts Over Time",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 22},
          "targets": [{"expr": "increase(kube_pod_container_status_restarts_total{namespace=~\"target-app|agents\"}[5m])", "legendFormat": "{{pod}}"}],
          "datasource": {"type": "prometheus", "uid": "prometheus"}
        }
      ],
      "schemaVersion": 39,
      "tags": ["dora", "sre", "platform"],
      "time": {"from": "now-24h", "to": "now"},
      "title": "DORA Metrics",
      "uid": "dora-metrics"
    }
