name: Frontend CI
on:
  pull_request:
    paths: ["apps/frontend/**"]
  push:
    branches: [main]
    paths: ["apps/frontend/**"]

defaults:
  run:
    working-directory: apps/frontend

permissions:
  contents: read
  id-token: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test -- --ci --coverage

  build-push:
    needs: lint-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::448658572737:role/github-actions-deploy
          aws-region: ap-southeast-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/target-frontend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/target-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
