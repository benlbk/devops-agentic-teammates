name: Agent Security Scan
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Trivy (Container)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always()

      - name: Run Checkov (IaC)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
        continue-on-error: true

      - name: Trigger Agent Analysis
        if: github.event_name == 'pull_request'
        run: |
          RESULT=$(curl -sk -X POST "${ORCHESTRATOR_URL}/api/tasks" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ORCHESTRATOR_TOKEN}" \
            -d "{\"taskType\":\"security-scan\",\"agentType\":\"test-secure\",\"repository\":\"${{ github.repository }}\",\"inputData\":{\"prNumber\":${{ github.event.pull_request.number }}}}")
          echo "Security scan task: $RESULT"
        env:
          ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
          ORCHESTRATOR_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}
