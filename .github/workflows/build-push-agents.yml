name: Build & Push Agent Images
on:
  push:
    branches: [main]
    paths:
      - "agents/**"
  workflow_dispatch:
    inputs:
      agent:
        description: "Specific agent to build (or 'all')"
        required: false
        default: "all"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.changes.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        run: |
          if [ "${{ github.event.inputs.agent }}" = "all" ] || [ -z "${{ github.event.inputs.agent }}" ]; then
            echo 'agents=["orchestrator","plan-collaborate","code-build","test-secure","release-deploy","operate-monitor"]' >> "$GITHUB_OUTPUT"
          else
            echo 'agents=["${{ github.event.inputs.agent }}"]' >> "$GITHUB_OUTPUT"
          fi

  build-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: ${{ fromJson(needs.detect-changes.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::448658572737:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: agents/
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/agent-${{ matrix.agent }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/agent-${{ matrix.agent }}:latest
          build-args: |
            AGENT_NAME=${{ matrix.agent }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
